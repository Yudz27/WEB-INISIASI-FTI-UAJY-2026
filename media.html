<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media - INISIASI FTI 2026</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- ============================== -->
    <!-- 1. NAVBAR akan otomatis muncul di sini -->
    <!-- ============================== -->
    <div id="navbar-container"></div>

    <!-- ============================== -->
    <!-- 2. KONTEN UTAMA halaman ini -->
    <!-- ============================== -->
    <main
      class="relative overflow-hidden bg-[url('img/error.png')] bg-cover bg-center bg-no-repeat w-full min-h-screen"
    >
      <div class="absolute inset-0 bg-slate-950/75"></div>
      <div
        class="absolute inset-x-0 top-0 h-40 bg-gradient-to-b from-sky-950/50 to-transparent"
      ></div>

      <div
        class="relative z-10 mx-auto flex min-h-screen max-w-7xl flex-col items-center px-4 py-16 text-center text-white sm:px-6 lg:px-8"
      >
        <h1
          class="z-20 bg-gradient-to-r from-cyan-300 via-sky-400 to-indigo-400 bg-clip-text text-4xl font-['Poppins'] font-extrabold leading-tight text-transparent drop-shadow-[0_8px_40px_rgba(0,0,0,0.6)] sm:text-5xl md:text-6xl animate-[fadeIn_1.2s_ease-out]"
        >
          MEDIA
        </h1>
        <p
          class="mt-3 max-w-xl text-sm leading-relaxed text-slate-300 sm:text-base"
        >
          Saksikan rangkaian karya dan informasi terbaru INISIASI FTI 2026.
        </p>

        <div class="mt-10 flex w-full max-w-5xl flex-col text-left">
          <div class="order-2 mt-8 grid w-full gap-5 sm:grid-cols-2">
            <div
              class="fade-shape rounded-2xl border border-white/15 bg-slate-900/60 p-3 shadow-2xl backdrop-blur-md transition duration-500 hover:-translate-y-1 hover:border-cyan-300/40 hover:shadow-[0_0_50px_rgba(34,211,238,0.12)] sm:p-4"
            >
              <div class="flex items-center justify-between gap-4">
                <p
                  class="font-['Poppins'] text-sm font-semibold tracking-[0.18em] text-cyan-300"
                >
                  TEASER
                </p>
              </div>
              <div
                class="mt-4 aspect-video overflow-hidden rounded-xl bg-slate-950 ring-1 ring-white/10"
              >
                <a
                  href="https://www.instagram.com/reel/DcbDBGcSarI/?utm_source=ig_web_copy_link&igsi=MzRlODBiNWFlZA=="
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Buka teaser di YouTube"
                >
                  <img
                    class="h-full w-full object-cover transition duration-300 hover:scale-105"
                    src="./img/TMBNLS.png"
                    alt="Thumbnail teaser INISIASI FTI 2026"
                  />
                </a>
              </div>
              <a
                class="mt-3 inline-block text-xs text-slate-400 transition hover:text-cyan-300"
              >
                Lihat Teaser di Instagram
              </a>
            </div>

            <div
              class="fade-shape rounded-2xl border border-white/15 bg-slate-900/60 p-3 shadow-2xl backdrop-blur-md transition duration-500 hover:-translate-y-1 hover:border-cyan-300/40 hover:shadow-[0_0_50px_rgba(34,211,238,0.12)] sm:p-4"
            >
              <div class="flex items-center justify-between gap-4">
                <p
                  class="font-['Poppins'] text-sm font-semibold tracking-[0.18em] text-cyan-300"
                >
                  DANCE JINGLE
                </p>
              </div>
              <div
                class="mt-4 aspect-video overflow-hidden rounded-xl bg-slate-950 ring-1 ring-white/10"
              >
                <a
                  href="https://youtu.be/1mrYDMXawJo?si=yI4PcKyg_hxlNDSI"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Buka teaser di YouTube"
                >
                  <img
                    class="h-full w-full object-cover transition duration-300 hover:scale-105"
                    src="./img/TMBNL.png"
                    alt="Thumbnail teaser INISIASI FTI 2026"
                  />
                </a>
              </div>
              <a
                class="mt-3 inline-block text-xs text-slate-400 transition hover:text-cyan-300"
              >
                Lihat Jingle di Youtube
              </a>
            </div>
          </div>

          <div
            class="order-1 mt-6 rounded-2xl border border-white/15 bg-slate-900/60 p-5 shadow-2xl backdrop-blur-md"
          >
            <div class="flex items-center justify-between gap-4">
              <p
                class="font-['Poppins'] text-sm font-semibold tracking-[0.18em] text-cyan-300"
              >
                LINK
              </p>
            </div>
            <div class="mt-5 grid gap-3 sm:grid-cols-3">
              <a
                href="https://docs.google.com/document/d/1mdUNKEsDYUZ376-OP1XznAg_igLTkDNKynBoDKPVpdg/edit?usp=sharing"
                target="_blank"
                rel="noopener noreferrer"
                class="group relative block overflow-hidden rounded-xl border border-cyan-300/20 bg-cyan-400/10 p-4 text-left transition duration-300 hover:-translate-y-1 hover:border-cyan-300/50 hover:bg-cyan-400/20"
              >
                <div class="relative">
                  <p class="text-sm font-semibold text-cyan-200">TWIBBON</p>
                  <p class="mt-1 text-sm text-slate-300">
                    Klik untuk membuka twibbon
                  </p>
                </div>
              </a>

              <a
                href="https://www.instagram.com/stories/highlights/18111438331815756/"
                target="_blank"
                rel="noopener noreferrer"
                class="group relative block overflow-hidden rounded-xl border border-cyan-300/20 bg-cyan-400/10 p-4 text-left transition duration-300 hover:-translate-y-1 hover:border-cyan-300/50 hover:bg-cyan-400/20"
              >
                <div class="relative">
                  <p class="text-sm font-semibold text-cyan-200">YEL-YEL</p>
                  <p class="mt-1 text-sm text-slate-300">
                    Klik untuk membuka yel-yel
                  </p>
                </div>
              </a>

              <a
                href="https://www.instagram.com/stories/highlights/18106208738127403/"
                target="_blank"
                rel="noopener noreferrer"
                class="group relative block overflow-hidden rounded-xl border border-cyan-300/20 bg-cyan-400/10 p-4 text-left transition duration-300 hover:-translate-y-1 hover:border-cyan-300/50 hover:bg-cyan-400/20"
              >
                <div class="relative">
                  <p class="text-sm font-semibold text-cyan-200">JARGON</p>
                  <p class="mt-1 text-sm text-slate-300">
                    Klik untuk membuka jargon
                  </p>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>

      <script>
        const fadeShape = document.querySelectorAll(".fade-shape");

        fadeShape.forEach((element) => {
          element.classList.add("opacity-0", "translate-y-5");
        });

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.remove("opacity-0", "translate-y-5");
                entry.target.classList.add("opacity-100", "translate-y-0");
              }
            });
          },
          { threshold: 0.3 },
        );

        fadeShape.forEach((element) => observer.observe(element));
      </script>

      <style>
        .fade-shape {
          transition-property: opacity, transform;
        }

        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      </style>
    </main>

    <!-- ============================== -->
    <!-- 3. FOOTER akan otomatis muncul di sini -->
    <!-- ============================== -->
    <div id="footer-container"></div>

    <!-- ============================== -->
    <!-- 4. Script yang menyatukan semuanya -->
    <!-- ============================== -->
    <script src="include.js" defer></script>
  </body>
</html>
